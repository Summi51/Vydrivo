version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console variables are available to the build shell, not to the
        # Next.js server runtime. Write the names Next.js needs into
        # .env.production before the build so SSR can read them. Values stay in
        # Amplify; this file never contains secrets.
        - env | grep -e '^SUPABASE_URL=' -e '^SUPABASE_PUBLISHABLE_KEY=' -e '^SUPABASE_GOOGLE_ENABLED=' >> .env.production
        # Instagram and private media are optional features. Copy them when the
        # branch defines them; the API reports "not configured" when they are
        # absent instead of failing the whole build.
        - (env | grep -e '^META_APP_ID=' -e '^META_APP_SECRET=' -e '^INSTAGRAM_CONFIG_ID=' -e '^INSTAGRAM_REDIRECT_URI=' -e '^INSTAGRAM_TOKEN_KEY=' >> .env.production) || true
        - (env | grep -e '^MEDIA_S3_' >> .env.production) || true
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
