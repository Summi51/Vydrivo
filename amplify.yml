version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console variables are available to the build shell, not to the
        # Next.js server runtime. Write the names Next.js needs into
        # .env.production before the build so SSR can read them. Values stay in
        # Amplify; this file never contains secrets.
        - env | grep -e '^SUPABASE_URL=' -e '^SUPABASE_PUBLISHABLE_KEY=' -e '^SUPABASE_GOOGLE_ENABLED=' >> .env.production
        # Instagram, the Gemini AI fallback and private media are optional
        # features. Copy them when the branch defines them; the API reports
        # "not configured" when they are absent instead of failing the build.
        - (env | grep -e '^META_APP_ID=' -e '^META_APP_SECRET=' -e '^INSTAGRAM_CONFIG_ID=' -e '^INSTAGRAM_REDIRECT_URI=' -e '^INSTAGRAM_TOKEN_KEY=' -e '^GEMINI_API_KEY=' -e '^GEMINI_MODEL=' -e '^GEMINI_TEXT_MODELS=' -e '^GEMINI_TTS_MODEL=' -e '^GEMINI_TTS_MODELS=' -e '^GEMINI_TTS_FEMALE_VOICE=' -e '^GEMINI_TTS_MALE_VOICE=' -e '^VOICE_PROVIDER=' -e '^VOICE_PROVIDER_FORCE=' -e '^VOICE_FALLBACK=' -e '^AI_BASE_URL=' -e '^AI_MODEL=' -e '^AI_API_KEY=' -e '^AI_FREE_TIER_VERIFIED=' >> .env.production) || true
        - (env | grep -e '^MEDIA_S3_' >> .env.production) || true
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
